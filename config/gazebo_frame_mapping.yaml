# Mapping used by the PZS100 Gazebo block spawner.
#
# The concrete-block stack keeps seed blocks, wall plans, and world model in ROS
# frame `world`. Gazebo `/spawn_entity` receives poses in Gazebo's own `world`.
# The PZS100 launches apply this fixed mapping when spawning blocks.

T_gazebo_world_ros_world:
  parent: gazebo_world
  child: ros_world
  xyz: [0.0, -6.0, 0.0]
  rpy_deg: [0.0, 0.0, 180.0]
  rpy_rad: [0.0, 0.0, 3.141592653589793]

spawn_settings:
  use_precomputed_gazebo_pose: false
  seed_frame_id: world
  gazebo_world_frame: world
  spawn_height_offset_m: 0.15
  sync_world_model_from_gazebo: false

source_launch_files:
  - launch_context/gazebo_wall_assembly_pzs100.launch.py
  - launch_context/gazebo_basic_pick_and_place_pzs100.launch.py

