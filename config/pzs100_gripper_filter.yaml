# PZS100 gripper point-cloud self-filter profile.
#
# The two FK rail segments (K9 -> K10_left_rail and K11 -> K12_right_rail)
# define the inside faces of outward-facing exclusion boxes.  The C++ core
# constructs and applies those boxes; an adapter supplies these frame names
# and the corresponding world-frame TF poses for each snapshot.
schema_version: 1
model: pzs100

enabled: true
outboard_extent_m: 0.30
cross_rail_extent_m: 0.90
rail_end_margin_m: 0.00

# Everything structurally above the jaws -- the jaw carrier, boom, and arm --
# is NOT covered by the two outward-facing rail boxes above, which only
# remove material outboard of each rail. Without this, boom/arm returns leak
# into the cloud and the geometric proposer fits nonsense blocks to them.
# The payload block hangs BELOW the jaws (the gripper grips it from above),
# so this volume is deliberately built to extrude only upward from the top of
# the jaw boxes -- it must never remove the payload.
# above_exclusion_height_m: how far up the volume extends above the jaws,
# covering the carrier/boom/arm silhouette (real PZS100 boom clearance).
# above_exclusion_margin_m: extra lateral margin added to the rail-to-rail
# gap width, since the boom/carrier can be a little wider than the jaws
# themselves and FK is not pixel-perfect.
above_exclusion_height_m: 1.20
above_exclusion_margin_m: 0.15

rails:
  - name: left
    parent_frame: elastic/K9
    rail_frame: elastic/K10_left_rail
    # K9 local +Z points outward, to the left of the gripper.
    outward_axis_parent: [0.0, 0.0, 1.0]
  - name: right
    parent_frame: elastic/K11
    rail_frame: elastic/K12_right_rail
    # K11 local +Z points outward, to the right of the gripper.
    outward_axis_parent: [0.0, 0.0, 1.0]
