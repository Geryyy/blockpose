# Annotated snapshots in data/seibersdorf_dataset, for DINO prior/verifier
# training and detector finetuning/ablations.
#
# The dataset holds 286 captures but only 24 distinct scenes: consecutive
# frames within a scene are near-duplicates of each other. One capture per
# distinct scene is annotated, deliberately, so this set is 25 snapshots
# rather than 286. Snapshot counts per scene are kept below so the
# duplication ratio stays visible.
#
# Selection is derived, not hand-listed: a snapshot qualifies when its
# annotations.yaml has annotation_complete: true and at least one approved
# block. All three independent signals (complete flag, approved blocks,
# presence of a tool-written backup) agree on the same 25 directories, so the
# classification is unambiguous. Regenerate rather than edit by hand.
#
# `scene` groups match config/rgb_ablation_splits_seibersdorf.yaml, so this
# composes with the existing leave-one-scenario-out folds instead of defining
# a second, competing grouping.
#
# `scenes_without_annotation` lists five scenes whose condition is already
# represented by an annotated scene, with the measured RGB similarity to it
# (mean-normalised 16x-downsampled correlation of a representative frame).
# wet/partially_wet at 0.95 is effectively the same scene. They are recorded
# rather than dropped so a reader can see the omission was a judgement about
# redundancy and not an oversight; static_occluded at 0.76 is the loosest
# match, if this set is ever extended.
#
# `approximate_poses` counts approved blocks whose pose came from the RGB-mask
# PCA fallback (provenance rgb_mask_pca_fallback) rather than a native
# geometric fit. The fallback places a canonical box on the selected points
# for the operator to correct by hand -- typical for a gripped block, whose
# top face the gripper occludes. These are human-approved but not
# fitter-derived: fine for detection/recall targets and DINO region
# supervision, worth care in pose-regression metrics.
schema_version: 1
dataset: data/seibersdorf_dataset
selection_criteria: 'one annotation per DISTINCT scene: annotation_complete: true
  AND at least one approved block. Consecutive captures within a scene are near-duplicate
  frames and are deliberately left unannotated.'
grouping: scene = capture directory prefix before '__'; matches config/rgb_ablation_splits_seibersdorf.yaml
  groups
