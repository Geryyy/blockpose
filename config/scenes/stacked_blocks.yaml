# Stacked blocks: a few vertical stacks (blocks resting upright, 0.9 m long axis up).
name: stacked_blocks

sensor:
  pos: [-6.0, 0.0, 4.5]
  look_at: [1.0, 0.0, 1.0]
  az_fov_deg: 110
  el_fov_deg: 70
  ang_res_deg: 0.25
  range_noise_std: 0.01

clutter: {trees: true, logs: true, container: false}

patterns:
  - {type: stack, count: 3, base: [0.0, 0.0], yaw_deg: 0}
  - {type: stack, count: 2, base: [1.3, 0.6], yaw_deg: 30}
  - {type: stack, count: 2, base: [0.4, -1.2], yaw_deg: 15}
