# Wall assembly: courses of upright blocks with a running-bond offset, plus one
# block still waiting in the staging area beside it.
name: wall

sensor:
  pos: [-6.0, -2.0, 4.5]
  look_at: [0.5, 1.0, 1.3]
  az_fov_deg: 125
  el_fov_deg: 80
  ang_res_deg: 0.25
  range_noise_std: 0.01

clutter: {trees: true, container: true, logs: true}

# 3-course wall running along +y (blocks side by side, courses stacked in z).
patterns:
  - {type: wall, origin: [0.0, 0.0], courses: 3, length: 5, axis: y, gap: 0.0, running_bond: true, yaw_deg: 0}

# A block still in staging, off to the side.
blocks:
  - {x: 2.4, y: -1.0, yaw_deg: 40}
