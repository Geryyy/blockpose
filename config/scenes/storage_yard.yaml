# Storage / staging: loose blocks waiting to be assembled, spread on the ground.
name: storage_yard

sensor:
  pos: [-6.0, -1.0, 4.5]
  look_at: [1.5, 1.0, 0.4]
  az_fov_deg: 120
  el_fov_deg: 75
  ang_res_deg: 0.25
  range_noise_std: 0.01

clutter: {trees: true, container: true, logs: true}

# Two staggered rows of isolated blocks + one rotated straggler.
patterns:
  - {type: row, count: 4, start: [0.0, 0.0], step: [0.0, 1.0], yaw_deg: 10}
  - {type: row, count: 4, start: [1.3, 0.4], step: [0.0, 1.0], yaw_deg: -8}
blocks:
  - {x: 2.6, y: 1.6, yaw_deg: 45}
