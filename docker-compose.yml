# Usage:
#   export BLOCKPOSE_DATASET=$HOME/data/block_perception_dataset
#   docker compose build core
#   docker compose run --rm core

services:
  core:
    image: blockpose-core
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    volumes:
      - .:/workspace
      - ${BLOCKPOSE_DATASET:?set BLOCKPOSE_DATASET to your dataset dir}:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - BLOCKPOSE_DATASET=/data
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - XDG_SESSION_TYPE=x11
      - GDK_BACKEND=x11
      - QT_QPA_PLATFORM=xcb
      - GLFW_PLATFORM=x11
      - LIBGL_ALWAYS_SOFTWARE=1
    working_dir: /workspace
    stdin_open: true
    tty: true
    # host networking so rerun-sdk in the container can reach a Rerun
    # viewer running on the host.
    network_mode: host
    ipc: host
