[project]
name = "blockpose"
version = "0.0.1"
description = "LiDAR-based 6-DoF pose estimation of concrete blocks — gripped, placed, or free — for robotic wall construction."
requires-python = ">=3.12"
readme = "README.md"

# NOTE: open3d wheel pin must match OPEN3D_VERSION in docker/Dockerfile.core.
dependencies = [
    "numpy>=1.26,<3",
    "open3d==0.19.0",
    "rerun-sdk>=0.22",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "ipykernel",           # spike notebooks (Phase P only; delete after)
]

# Phase 7 (gated) — do NOT install until the learned-component gate triggers.
# learned = ["torch", ...]

[tool.uv]
# The compiled pybind11 module is built by CMake and installed into the venv
# via `make python-install`; this project only manages the pure-Python layer.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/blockpose"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "NPY", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
