[project]
name = "blockpose"
version = "0.0.1"
description = "LiDAR-based 6-DoF pose estimation of concrete blocks — gripped, placed, or free — for robotic wall construction."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy>=1.26,<3",
    "open3d==0.19.0",
    "rerun-sdk>=0.22",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "pillow>=10",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "ipykernel",
    "jupyterlab",
    "plotly>=5.20",
]
sam = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers>=4.57",
]

# SAM remains opt-in: normal detector and annotator installs do not pull model runtimes.
# torch/torchvision are pinned exact and routed to the CUDA 12.8 wheel index below so
# `uv sync` reproduces exactly what docker/Dockerfile.core bakes into the image, instead
# of drifting to whatever's newest on PyPI on every sync.

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/blockpose"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "NPY", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
